<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MycoScope — Diagnostic Specimen Workbench</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand">MycoScope</div><div class="subtitle">Diagnostic Specimen Workbench<br>Field · Macro · Spore Print · Microscopy</div><input id="search" class="search" placeholder="Search accession / site"><div id="specList" class="spec-list"></div></aside>
<main id="content" class="content"><div class="topbar"><div><strong>MycoScope — Inspection Prototype</strong><div class="hint" id="recordCount"></div></div><div class="hint">Click any image for full-resolution zoom + pan</div></div><div id="main" class="container"></div></main></div>
<div id="viewer" class="viewer"><div class="viewer-bar"><div class="viewer-title"><strong id="viewerCap"></strong><small id="viewerName"></small></div><button id="zoomOut" class="toolbtn">−</button><button id="zoomIn" class="toolbtn">+</button><button id="fit" class="toolbtn">Fit</button><button id="oneToOne" class="toolbtn">100%</button><button id="openOriginal" class="toolbtn">Original</button><button id="closeViewer" class="toolbtn">Close</button></div><div id="viewerStage" class="viewer-stage"><img id="viewerImg" class="viewer-img" draggable="false"><div class="viewer-help">Mouse wheel = zoom · drag = pan · double-click = fit · Esc = close</div></div></div>
<script src="data.js"></script><script src="app.js"></script></body></html>
