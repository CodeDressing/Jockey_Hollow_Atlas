name: Rutgers R.4 original media SHA-256 acceptance
on:
  push:
    branches:
      - feature/rutgers-r4-cryptographic-original-verification-20261101
  pull_request:
    paths:
      - research/rutgers_r4_verified_originals_sha256_20261101.json
      - tests/rutgers-r4-sha256.cjs
permissions:
  contents: read
jobs:
  independent-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch isolated AN2-F22 original-media branch without modifying production
        run: git fetch --no-tags origin feature/an2-f22-deof-photo-intake-20261022
      - name: Verify fresh independent SHA-256 against all original repository binaries
        run: |
          node --check tests/rutgers-r4-sha256.cjs
          node tests/rutgers-r1-integrity.cjs
          node tests/rutgers-r2-description-crosswalk.cjs
          node tests/rutgers-r3-media-crosswalk.cjs
          node tests/rutgers-r4-sha256.cjs
      - name: Install free Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify accession navigation and photo evidence
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rutgers-r4-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/rutgers-r1-browser.cjs
          node tests/an2-f12-browser.cjs
