name: Atlas gallery integrity
on:
  pull_request:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'assets/**'
      - '*media.js'
      - '*drive_data.js'
      - 'research/**'
      - 'scripts/verify_atlas_images.cjs'
      - 'tests/public-atlas-no-drive-links-20261117.cjs'
      - '.github/workflows/atlas-gallery-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image and browser test dependencies
        run: |
          npm install --no-save playwright@1.56.1 sharp@0.34.5
          npx playwright install --with-deps chromium firefox webkit
      - name: Verify all local gallery bytes and decode pixels
        run: node scripts/verify_atlas_images.cjs --decode
      - name: Check Atlas galleries in Chromium, Firefox and WebKit
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/atlas-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          node tests/public-atlas-no-drive-links-20261117.cjs
