name: Rutgers R.8 master boundary and historical count QA
on:
  push:
    branches:
      - feature/rutgers-r8-master-boundary-reconciliation-20261101
  pull_request:
    paths:
      - research/rutgers_r8_record_boundary_reconciliation_20261101.json
      - tests/rutgers-r8-record-boundaries.cjs
permissions:
  contents: read
jobs:
  master-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch source-photo isolate without modifying archive
        run: git fetch --no-tags origin feature/an2-f22-deof-photo-intake-20261022
      - name: Validate R1-R8 source-integrity and original SHA-256 files
        run: |
          node --check app.js
          node --check tests/rutgers-r8-record-boundaries.cjs
          node tests/rutgers-r1-integrity.cjs
          node tests/rutgers-r2-description-crosswalk.cjs
          node tests/rutgers-r3-media-crosswalk.cjs
          node tests/rutgers-r4-sha256.cjs
          node tests/rutgers-r5-voucher-matrix.cjs
          node tests/rutgers-r6-voucher-traceability.cjs
          node tests/rutgers-r7-fieldmaster-conflicts.cjs
          node tests/rutgers-r8-record-boundaries.cjs
      - name: Install free Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-verify specimen gallery and accession sidebar
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rutgers-r8-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/rutgers-r1-browser.cjs
          node tests/an2-f12-browser.cjs
