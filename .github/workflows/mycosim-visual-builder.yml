name: MycoSim visual builder feature QA
on:
  push:
    branches: [feature/mycosim-visual-mushroom-builder-20261019]
  pull_request:
    paths:
      - 'mycosim/visual_builder.js'
      - 'mycosim/visual_builder_3d.js'
      - 'sandbox.html'
      - 'tests/mycosim-visual-builder.spec.mjs'
      - 'tests/mycosim-laboratory-navigation.spec.mjs'
      - 'tests/mycosim-restoration-ux.spec.mjs'
      - 'tests/mycosim-restoration-teaching.spec.mjs'
      - 'tests/mycosim-release-preservation.spec.mjs'
      - 'tests/mycosim-clear-view-sprint2.spec.mjs'
      - 'tests/mycosim-clear-view-redundancy.spec.mjs'
      - 'mycosim/optional_creative_studio.js'
      - 'mycosim/lab_navigation.js'
      - 'mycosim/teaching_guide.js'
      - 'mycosim/restoration_ux.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check mycosim/visual_builder.js
          node --check mycosim/visual_builder_3d.js
          node --check mycosim/lab_navigation.js
          node --check mycosim/teaching_guide.js
          node --check mycosim/main.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/mycosim-visual-http.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8765/sandbox.html -o /dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Browser regression
        run: npx playwright test tests/mycosim-clear-view-sprint2.spec.mjs tests/mycosim-clear-view-redundancy.spec.mjs tests/mycosim-laboratory-navigation.spec.mjs tests/mycosim-restoration-ux.spec.mjs tests/mycosim-restoration-teaching.spec.mjs tests/mycosim-release-preservation.spec.mjs --browser=chromium --workers=1 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mycosim-clear-view-sprint2-final-and-redundancy
          path: test-results/
          if-no-files-found: ignore
