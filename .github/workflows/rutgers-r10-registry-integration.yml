name: Rutgers R.10 read-only registry integration QA
on:
  push:
    branches:
      - feature/rutgers-r10-registry-integration-20261101
  pull_request:
    paths:
      - research/tools/rutgers_r10_registry_reconcile.cjs
      - research/rutgers_r10_reversible_registry_diff_20261101.json
      - tests/rutgers-r10-registry-integration.cjs
permissions:
  contents: read
jobs:
  registry-integrity-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Fetch original research branches (read-only)
        run: |
          git fetch --no-tags origin feature/an2-f22-deof-photo-intake-20261022
          git fetch --no-tags origin feature/fieldmaster-477-evidence-20261022
          git show origin/feature/fieldmaster-477-evidence-20261022:research/fieldmaster_deo_2_1_canonical_reconciliation_20261023.json > /tmp/rutgers-r10-fieldmaster-legacy.json
      - name: Validate deterministic registry and all inherited scientific checks
        run: |
          node --check research/tools/rutgers_r10_registry_reconcile.cjs
          node --check tests/rutgers-r10-registry-integration.cjs
          node tests/rutgers-r1-integrity.cjs
          node tests/rutgers-r2-description-crosswalk.cjs
          node tests/rutgers-r3-media-crosswalk.cjs
          node tests/rutgers-r4-sha256.cjs
          node tests/rutgers-r5-voucher-matrix.cjs
          node tests/rutgers-r6-voucher-traceability.cjs
          node tests/rutgers-r7-fieldmaster-conflicts.cjs
          node tests/rutgers-r8-record-boundaries.cjs
          node tests/rutgers-r9-parser.cjs
          node tests/rutgers-r10-registry-integration.cjs /tmp/rutgers-r10-fieldmaster-legacy.json
          node research/tools/rutgers_r10_registry_reconcile.cjs /tmp/rutgers-r10-fieldmaster-legacy.json > /tmp/rutgers-r10-reproduced-manifest.json
      - name: Install free Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser verify specimen sidebar, original media and caveats
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rutgers-r10-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/rutgers-r1-browser.cjs
          node tests/an2-f12-browser.cjs
