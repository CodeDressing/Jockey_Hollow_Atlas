name: MycoSim free browser release gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [mycosim-campaign6-human-biology]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test MycoSim in real Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mycosim-server.log 2>&1 &
          node tests/mycosim-campaign6-browser.cjs
          node tests/atlas-evidence-tiers.cjs
          node tests/atlas-media-integrity.cjs
          node tests/chet-lions-mane-search.cjs
          node tests/jn2-f3-full-dataset.cjs
          node tests/specimen-recovery-20261116.cjs
          node tests/iphone-gallery-webkit-20261116.cjs
