name: Rutgers R.9 canonical accession parser QA
on:
  push:
    branches:
      - feature/rutgers-r9-canonical-parser-validation-20261101
  pull_request:
    paths:
      - research/rutgers_r9_source_heading_ledger_20261101.json
      - research/rutgers_r9_parser_validation_report_20261101.json
      - research/tools/rutgers_accession_boundary_parser.cjs
      - tests/rutgers-r9-parser.cjs
permissions:
  contents: read
jobs:
  parser-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Fetch F22 isolated original binaries for read-only verification
        run: git fetch --no-tags origin feature/an2-f22-deof-photo-intake-20261022
      - name: Validate source parser and R1-R9 preservation
        run: |
          node --check research/tools/rutgers_accession_boundary_parser.cjs
          node --check tests/rutgers-r9-parser.cjs
          node tests/rutgers-r1-integrity.cjs
          node tests/rutgers-r2-description-crosswalk.cjs
          node tests/rutgers-r3-media-crosswalk.cjs
          node tests/rutgers-r4-sha256.cjs
          node tests/rutgers-r5-voucher-matrix.cjs
          node tests/rutgers-r6-voucher-traceability.cjs
          node tests/rutgers-r7-fieldmaster-conflicts.cjs
          node tests/rutgers-r8-record-boundaries.cjs
          node tests/rutgers-r9-parser.cjs
      - name: Install free Chromium
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check specimen sidebar and AN2-F12 gallery
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/rutgers-r9-http.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/rutgers-r1-browser.cjs
          node tests/an2-f12-browser.cjs
