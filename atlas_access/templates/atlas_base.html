<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, noarchive">
  <title>{% block title %}Jockey Hollow Atlas{% endblock %}</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.55 system-ui, sans-serif; background:#111a17; color:#edf4ed; }
    body { max-width: 54rem; margin: 0 auto; padding: 1.5rem; }
    a { color:#a4e0ba; }
    h1 { font-size: clamp(1.65rem, 6vw, 2.6rem); }
    section { padding: 1rem; background:#1b2922; margin-block:1rem; border-radius:.65rem; }
    input, select, button { box-sizing:border-box; padding:.55rem .7rem; font:inherit; border-radius:.35rem; max-width:100%; }
    input, select { border:1px solid #809488; }
    button { color:#142219; background:#b8dec4; border:1px solid #b8dec4; cursor:pointer; }
    form { margin-block:.65rem; }
    nav { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; }
    img { max-width:100%; height:auto; }
    code { overflow-wrap:anywhere; }
    li { margin-block:.45rem; overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Atlas access">
      <a href="{% url 'atlas' %}">Jockey Hollow Atlas</a>
      {% if user.is_authenticated %}
        <a href="{% url 'atlas-owner' %}">Owner dashboard</a>
        <form method="post" action="{% url 'atlas-sign-out' %}">{% csrf_token %}<button>Sign out</button></form>
      {% endif %}
    </nav>
    {% if messages %}
      <ul role="status">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>
    {% endif %}
  </header>
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
